<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Workshop Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>JS Workshop Registration</h1>
        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Name (50 characters max):</label>
                <input type="text" id="name" name="name" required maxlength="50">
            </div>
            <div class="form-group">
                <label for="cpf">CPF (11 characters max):</label>
                <input type="text" id="cpf" name="cpf" required maxlength="11">
            </div>
            <div class="form-group">
                <label for="email">Email (50 characters max):</label>
                <input type="email" id="email" name="email" required maxlength="50">
            </div>
            <div class="form-group">
                <label for="career">Career (50 characters max):</label>
                <input type="text" id="career" name="career" maxlength="50">
            </div>
            <div class="form-group">
                <label for="comment">Comment:</label>
                <textarea id="comment" name="comment"></textarea>
                <span id="charCount">0/200</span>
            </div>
            <button type="submit" id="registerButton">Register</button>
        </form>
        <div id="message" class="message"></div>
    </div>
</body>
</html>
