<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sandbox JavaScript</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* Page-specific layout only — every color, font, and component
     style (code-panel, buttons, output panel, themes, font-scale)
     comes from the shared styles.css, so this page always matches
     whatever the slide decks look like. */
  html, body {
    height: auto;
    min-height: 100%;
    overflow: auto;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(24px, 5vw, 64px) 20px;
  }
  .sandbox-header {
    width: 100%;
    max-width: 760px;
    margin-bottom: 28px;
  }
  .sandbox-header p.eyebrow {
    font-family: var(--font-ui);
    font-size: .82rem;
    color: var(--yellow);
    margin: 0 0 6px 0;
  }
  .sandbox-header h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    color: var(--text-white);
    margin: 0 0 8px 0;
  }
  .sandbox-header p.sandbox-sub {
    font-family: var(--font-ui);
    color: var(--text-light);
    max-width: 60ch;
    line-height: 1.55;
    margin: 0;
  }
  .sandbox-header code {
    color: var(--yellow);
    background: rgba(247,223,30,.08);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .sandbox-main {
    width: 100%;
    max-width: 760px;
  }
  .sandbox-main textarea.code-input {
    min-height: 220px;
  }
</style>
</head>
<body>

<header class="sandbox-header">
  <p class="eyebrow">Sandbox</p>
  <h1>Sandbox de JavaScript</h1>
  <p class="sandbox-sub">Escreva JavaScript no editor abaixo e clique em "Executar" para rodar. <code>console.log()</code>, <code>console.error()</code>, <code>console.warn()</code> e <code>prompt()</code> funcionam normalmente, já que isto roda direto no seu navegador.</p>
</header>

<main class="sandbox-main">
  <div class="code-panel" data-runner>
    <div class="code-panel-head">
      <span class="code-panel-title">sandbox.js</span>
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <textarea class="code-input" spellcheck="false" rows="12">console.log("Olá, mundo!");</textarea>
    <div class="code-actions">
      <button type="button" class="run-btn">Executar ▸</button>
      <button type="button" class="reset-btn">Reiniciar</button>
      <span class="run-hint">Ctrl / Cmd + Enter também executa</span>
    </div>
    <div class="output-panel" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
